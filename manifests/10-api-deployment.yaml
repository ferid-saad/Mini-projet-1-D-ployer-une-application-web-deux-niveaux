# ============================================================
# Étape 1 – Deployment de l'API (Exigences E2, E4)
#
# Image   : ghcr.io/stefanprodan/podinfo:6.5.4 (version explicite, pas latest)
# Réplicas: 3
# Labels  : app=api, tier=backend
#
# La stratégie RollingUpdate avec maxUnavailable=0 garantit
# qu'aucun Pod n'est supprimé avant qu'un nouveau soit prêt
# → zéro interruption lors d'une mise à jour (Exigence E9).
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: feridsaad
  labels:
    app: api
    tier: backend
    project: mini-projet-1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
      tier: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # Jamais moins de 3 Pods prêts pendant la mise à jour (E9)
      maxSurge: 1         # Un Pod supplémentaire créé avant d'en supprimer un ancien
  template:
    metadata:
      labels:
        app: api
        tier: backend
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.6.0   # Version de référence (E2) — mise à jour vers 6.6.0 démontrée (E9)
          ports:
            - containerPort: 9898
              name: http
          # La readinessProbe assure qu'un Pod ne reçoit du trafic que
          # lorsqu'il est pleinement opérationnel → rolling update sans coupure
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
